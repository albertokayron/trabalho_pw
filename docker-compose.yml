version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironberg_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: academia
      DB_USER: root
      DB_PASS: academia_root_password
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: ironberg_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: academia_root_password
      MYSQL_DATABASE: academia
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pacademia_root_password"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
